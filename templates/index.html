
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default('Posts') }}</title>
        <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}"
    >

</head>

<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('root') }}">FastAPI Blog</a>
        <div class="nav-links">
        {% if current_user %}
            <a class="profile-link" href="{{ url_for('profile_page') }}" aria-label="Open your profile">
                {% if current_user.profile_image %}
                <img class="avatar" src="{{ url_for('profile_images', path=current_user.profile_image) }}" alt="Your profile photo" width="40" height="40">
                {% else %}
                <span class="avatar avatar-placeholder" aria-hidden="true">{{ current_user.username[0]|upper }}</span>
                {% endif %}
                <span>{{ current_user.username }}</span>
            </a>
            <form action="{{ url_for('logout') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="nav-button" type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{{ url_for('login_page') }}">Log in</a>
            <a href="{{ url_for('signup_page') }}">Sign up</a>
        {% endif %}
        </div>
    </nav>

   {% block content%}
   
   {% endblock content%}

</body>
</html>
