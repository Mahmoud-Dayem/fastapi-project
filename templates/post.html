 
{% extends "layout.html" %}

{% block content %}

<style>
    :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #eef4ff;
        --text: #172033;
        --muted: #64748b;
        --line: #d9e2ef;
        --accent: #2563eb;
        --accent-dark: #1e40af;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(
                circle at top left,
                rgba(37, 99, 235, 0.16),
                transparent 34rem
            ),
            linear-gradient(
                180deg,
                #f8fbff 0%,
                var(--bg) 52%,
                #edf2f7 100%
            );

        color: var(--text);

        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    .page-shell {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
    }

    /* Back button */

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        margin-bottom: 24px;

        color: var(--accent);
        text-decoration: none;

        font-size: 0.95rem;
        font-weight: 700;

        transition: color 180ms ease;
    }

    .back-link:hover {
        color: var(--accent-dark);
    }

    /* Main article */

    .post {
        padding: 42px;

        border: 1px solid rgba(217, 226, 239, 0.9);
        border-radius: 12px;

        background: rgba(255, 255, 255, 0.92);

        box-shadow: var(--shadow);
    }

    /* Post number */

    .post-number {
        display: inline-grid;

        width: 48px;
        height: 48px;

        place-items: center;

        margin-bottom: 24px;

        border-radius: 10px;

        background: var(--surface-soft);

        color: var(--accent-dark);

        font-size: 1rem;
        font-weight: 800;
    }

    /* Title */

    .post-title {
        max-width: 760px;

        margin: 0 0 20px;

        color: var(--text);

        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 1.08;

        letter-spacing: -0.035em;
    }

    /* Author and date */

    .post-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;

        gap: 10px;

        padding-bottom: 26px;
        margin-bottom: 32px;

        border-bottom: 1px solid var(--line);

        color: var(--muted);

        font-size: 0.95rem;
    }

    .post-author {
        color: var(--text);
        font-weight: 700;
    }

    .separator {
        color: #94a3b8;
    }

    /* Content */

    .post-content {
        color: #46566f;

        font-size: 1.12rem;
        line-height: 1.85;
    }

    .post-content p {
        margin: 0;
    }

    /* Bottom area */

    .post-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 16px;

        margin-top: 40px;
        padding-top: 24px;

        border-top: 1px solid var(--line);
    }

    .post-id {
        color: var(--muted);

        font-size: 0.88rem;
    }

    .all-posts {
        display: inline-flex;
        align-items: center;

        padding: 10px 16px;

        border-radius: 8px;

        background: var(--accent);

        color: white;

        font-size: 0.9rem;
        font-weight: 700;

        text-decoration: none;

        transition:
            background 180ms ease,
            transform 180ms ease;
    }

    .all-posts:hover {
        background: var(--accent-dark);
        transform: translateY(-2px);
    }

    /* Mobile */

    @media (max-width: 640px) {

        .page-shell {
            width: min(100% - 24px, 900px);
            padding: 32px 0;
        }

        .post {
            padding: 26px 22px;
        }

        .post-title {
            font-size: 2rem;
        }

        .post-content {
            font-size: 1rem;
        }

        .post-footer {
            flex-direction: column;
            align-items: flex-start;
        }
    }

</style>


<main class="page-shell">

    <!-- Back to home -->

    <a href="/" class="back-link">
        ← Back to posts
    </a>


    <!-- Selected post -->

    <article class="post">

        <span class="post-number">
            {{ "%02d"|format(post.id) }}
        </span>


        <h1 class="post-title">
            {{ post.title }}
        </h1>


        <div class="post-meta">

            <span class="post-author">
                {{ post.author }}
            </span>

            <span class="separator" aria-hidden="true">
                /
            </span>

            <span>
                {{ post.date_posted }}
            </span>

        </div>


        <div class="post-content">

            <p>
                {{ post.content }}
            </p>

        </div>


        <footer class="post-footer">

            <span class="post-id">
                Post #{{ post.id }}
            </span>

            <a href="{{url_for("root")}}" class="all-posts">
                View all posts
            </a>

        </footer>

    </article>

</main>

{% endblock content %}
