{% if current_user and current_user.id == post.user_id %}
<div class="post-actions">
    <a class="edit-link" href="{{ url_for('edit_post', post_id=post.id) }}">Edit</a>
    <form action="{{ url_for('delete_post', post_id=post.id) }}" method="post" onsubmit="return confirm('Delete this post permanently?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="delete-button" type="submit">Delete</button>
    </form>
</div>
{% endif %}
