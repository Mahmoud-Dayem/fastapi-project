{% extends "index.html" %}
{% block content %}
<main class="auth-shell"><section class="auth-card">
<h1>Reset your password</h1>
{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
{% if token %}
<form class="auth-form" action="/reset-password" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input type="hidden" name="token" value="{{ token }}">
<label for="password">New password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
<button class="auth-button" type="submit">Reset password</button>
</form>
{% endif %}
<p><a href="{{ url_for('login_page') }}">Back to login</a></p>
</section></main>
{% endblock %}
